<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>On Duty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday work tool for one ward nurse, calm and quick to read between rounds
   IDEA the ward handover relay: night → day → evening → night, a baton passed down a line
   PICTURE a sky band for the selected shift (sun, sunset, moon) over a vertical relay: 받는 인계 → 나 → 주는 인계
   COLOUR white or deep night ground; shift colours amber D, coral E, indigo N, teal MD; team rose A, green B, sky C
   TYPE IBM Plex Sans KR for everything, weights carry hierarchy
   LAYOUT phone first: header, Sun–Sat month calendar, now, relay (all teams, my team first) with the rest of the ward folded in, original photos; at 760px+ calendar beside relay */
:root{color-scheme:light;--bg:light-dark(#fff8f3,#1c1512);--top:light-dark(#ffeee3,#2a1d18);--surf:light-dark(#ffffff,#261c18);--ink:light-dark(#40261c,#f8eae2);--mute:light-dark(#8a6d61,#bfa293);--line:light-dark(#f6e1d6,#3b2c25);--card:light-dark(#fdeee5,#33251f);--sh:light-dark(rgba(220,120,80,.32),rgba(0,0,0,.5));--acc:#ff9a76;--d:#ffc94d;--e:#ff8273;--n:#8a83f0;--md:#45bfa2;--ta:#f0759a;--tb:#5cbf7d;--tc:#ff9a76;--off:light-dark(#c9aea2,#7d675e)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--tc);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-left,0px))}
.me{display:flex;align-items:center;gap:10px;flex:1}
.tog{--c:var(--off);flex:none;position:relative;width:46px;height:28px;border-radius:14px;background:var(--c);transition:background .5s}
.tog i{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .55s cubic-bezier(.5,1.6,.4,1)}
.tog.on i{transform:translateX(18px)}
.logo{font-family:"Fredoka","IBM Plex Sans KR",sans-serif;font-weight:600;font-size:24px;line-height:1;letter-spacing:-.01em}
.cdown{--c:var(--off);border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--bg));border-radius:12px;min-height:40px;padding:3px 12px;display:grid;justify-items:end;line-height:1.2;text-align:right}
.cdown .cl{font-size:11px;font-weight:600;color:var(--mute)}
.cdown b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cal{padding:10px 10px 8px}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.calh h2{margin:0;font-size:17px;letter-spacing:-.02em}
.mbtn{width:40px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:600;display:grid;place-items:center}
.mbtn:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wk{text-align:center;font-size:12px;font-weight:600;color:var(--mute);padding:2px 0}
.wk.sun,.day .n.sun{color:var(--e)}
.wk.sat,.day .n.sat{color:var(--n)}
.day{border:0;background:transparent;border-radius:10px;padding:3px 0 4px;min-height:44px;display:grid;justify-items:center;align-content:start;gap:2px;transition:background .2s,transform .15s}
.day:active{transform:scale(.95)}
.day .n{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.day.today .n{text-decoration:underline 2px;text-underline-offset:4px}
.day[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.day[aria-pressed=true] .n{color:inherit}
.day.empty{visibility:hidden}
.day .pill{min-width:0;width:calc(100% - 8px);max-width:40px;font-size:11px;padding:0 2px}
.pill{min-width:30px;height:18px;border-radius:6px;font-size:12px;font-weight:700;display:grid;place-items:center;color:#fff;padding:0 4px}
.k-D{background:var(--d);color:#2b1a00}.k-E{background:var(--e)}.k-N{background:var(--n)}.k-MD{background:var(--md)}
.k-OFF{background:transparent;color:var(--off);border:1.5px dashed var(--off)}
.k-WOFF{background:transparent;color:var(--ta);border:1.5px solid var(--ta)}
.k-ETC,.k-LEAVE{background:var(--card);color:var(--mute);border:1px solid var(--line)}
main{padding:10px max(12px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));max-width:1080px;margin:0 auto;display:grid;gap:10px}
#hero,#now,#mine{scroll-margin-top:84px}
[hidden]{display:none!important}
#mine{grid-area:me}#calbox{grid-area:cal;touch-action:pan-y}#now{grid-area:now}#hero{grid-area:hero}#pics{grid-area:pics}
main{grid-template-areas:"me" "now" "cal" "hero" "pics"}
@media(min-width:760px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"me me" "now hero" "cal hero" "pics pics";align-items:start}}
.hero{border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.sky{position:relative;height:96px;padding:12px 16px;color:#fff;transition:background .5s}
.sky.D{background:linear-gradient(160deg,#ffe29a,#ffb347 70%,#f59a23);color:#2b1a00}
.sky.E{background:linear-gradient(160deg,#ff9a6b,#e8504a 55%,#a8346f)}
.sky.N{background:linear-gradient(170deg,#141a4f,#2b2f8f 70%,#4a3aa8)}
.sky.OFF,.sky.WOFF,.sky.LEAVE,.sky.ETC{background:linear-gradient(160deg,light-dark(#eef1f6,#202634),light-dark(#d9dfe9,#161b26));color:var(--ink)}
.sky svg{position:absolute;right:0;top:0;width:60%;height:100%}
.sky .dt{position:relative;font-size:13px;font-weight:500;opacity:.85}
.sky h1{position:relative;margin:2px 0 0;font-size:32px;line-height:1.05;letter-spacing:-.03em;font-weight:700}
.sky .sub{position:relative;font-size:13px;font-weight:500;margin-top:2px;opacity:.9}
.relay{padding:12px 14px 12px;display:grid;gap:0}
.stop{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;position:relative}
.rail{position:relative;display:flex;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;margin-top:3px;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--c);background:var(--c);z-index:1}
.stop.mine .dot{width:20px;height:20px;margin-top:0}
.line{position:absolute;top:16px;bottom:-6px;width:4px;border-radius:2px;background:linear-gradient(var(--c),var(--c2))}
.baton{position:absolute;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--ink);top:20px;animation:run 2.4s cubic-bezier(.5,0,.5,1) infinite}
.body{padding-bottom:10px}
.lab{font-size:13px;color:var(--mute);font-weight:500}
.lab b{color:var(--ink);font-weight:600}
.who{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 8px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600;white-space:nowrap}
.chip.big{height:36px;font-size:16px;background:var(--bg);border:1.5px solid var(--c,var(--line))}
.chip.self{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .t{flex:none;width:18px;height:18px;border-radius:5px;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.t-A{background:var(--ta)}.t-B{background:var(--tb)}.t-C{background:var(--tc)}
.chip .cd{font-size:12px;color:var(--mute);font-weight:600}
.others{margin-top:3px;font-size:13px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:4px}
.mg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border:2px solid var(--tc);border-radius:21px;background:color-mix(in srgb,var(--tc) 9%,var(--surf));max-width:100%}
.mg .chip{background:var(--surf)}.mg .chip.big{border:0}.mg .chip.self{background:var(--ink)}
.ext{padding:0 14px 10px}
.ext .row:first-child{border-top:1px solid var(--line)}
.ext .row.on{margin:0 -8px}
.panel{border:1px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--bg)}
.panel h2{margin:0 0 4px;font-size:16px;letter-spacing:-.02em}
.row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:start}
.row:first-of-type{border-top:0}
.row .h{display:flex;flex-direction:column;gap:0;padding-top:8px;line-height:1.25}
.row .h b{font-size:14px}
.row .h span{font-size:11px;color:var(--mute)}
.row.on{background:color-mix(in srgb,var(--c) 10%,transparent);margin:0 -12px;padding:6px 12px;border-radius:0}
.mebar{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:16px;padding:10px 12px;background:var(--ink);color:var(--bg);text-align:left;min-height:52px}
.ip{display:inline-grid;vertical-align:2px;margin-left:4px;min-width:26px;height:20px;font-size:12px}
.mebar>.pill{flex:none;min-width:40px;height:26px;font-size:12px;border-radius:8px}
.mebar .st{flex:1;display:grid;line-height:1.3}
.mebar .st b{font-size:16px;letter-spacing:-.02em}
.mebar .st>span{font-size:12px;opacity:.75}
.mebar .go{font-size:13px;font-weight:600;opacity:.85;white-space:nowrap}
.ward .wh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ward .wh h2{margin:0}
.ward .wh .tm{font-size:12px;color:var(--mute);margin-left:auto;white-space:nowrap}
.lab .nowtag{margin:0 0 0 4px;vertical-align:1px}
.nowtag{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:#fff;background:var(--e);border-radius:5px;padding:0 5px;width:max-content}
.next{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;padding:8px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);width:100%;text-align:left;min-height:44px}
.next b{font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{height:36px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shot{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;-webkit-overflow-scrolling:touch}
.shot img{display:block;width:100%;height:auto;cursor:zoom-in}
.shot.zoom img{width:auto;max-width:none;cursor:zoom-out}
.fade{animation:fade .35s ease}
@keyframes run{0%{top:20px;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:calc(100% - 4px);opacity:0}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--e) 60%,transparent)}80%,100%{box-shadow:0 0 0 8px transparent}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes tw{50%{opacity:.25}}
.bob{animation:bob 4s ease-in-out infinite}
.tw{animation:tw 3s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.tog,.tog i{transition:none}.baton,.bob,.tw,.fade{animation:none}.baton{display:none}}

/* 피치 크림 테마: 밝고 말랑한 표면, 둥근 제목 */
body{background:linear-gradient(var(--top),var(--bg) 260px) no-repeat,var(--bg)}
.top{background:color-mix(in srgb,var(--top) 88%,transparent);border-bottom:0}
.panel,.hero{background:var(--surf);border:0;border-radius:22px;box-shadow:0 8px 20px -12px var(--sh)}
.relay{background:var(--surf)}
.panel h2,.calh h2,.ward .wh h2,.sky h1{font-family:"Jua","IBM Plex Sans KR",sans-serif;font-weight:400;letter-spacing:0}
.logo{font-size:26px;color:var(--ink)}
.sky h1{font-size:34px}
.panel h2,.calh h2,.ward .wh h2{font-size:18px}
.chip{border:0;border-radius:999px;background:var(--card)}
.chip.big{border-radius:999px;background:var(--surf)}
.chip.self{background:var(--ink);color:var(--bg)}
.pill{border-radius:999px}
.k-D{color:#4a3000}
.day{border-radius:14px}
.day[aria-pressed=true]{background:var(--surf);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),0 4px 10px -5px var(--sh)}
.day[aria-pressed=true] .n{font-weight:800}
.day,.sky{transition:none}
.day:active{transform:none;background:var(--card)}
.fade{animation:none}
.k-OFF{background:#f3e5dc;color:#7a5a4d;border:0}
.k-WOFF{background:#fde2ea;color:#c2456b;border:0}
.mbtn{border:0;background:var(--card);border-radius:14px}
.mebar{background:var(--acc);color:#fff;border-radius:22px;box-shadow:0 8px 18px -10px var(--sh)}
.mebar>.k-OFF,.mebar>.k-WOFF{background:rgba(255,255,255,.28);color:#fff;border:0}
.cdown{border-radius:16px}
.tab{border:0;border-radius:999px}
.tab[aria-pressed=true]{background:var(--acc);color:#fff}
.row.on{border-radius:14px;margin:0 -8px;padding:6px 8px}
.shot{border:0;border-radius:16px}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="me"><span class="tog" id="tog" aria-hidden="true"><i></i></span><b class="logo">On Duty</b></div>
    <button class="cdown" id="goNow" type="button" hidden><span class="cl" id="cdL"></span><b id="cdT"></b></button>
  </div>
</header>
<main id="main">
  <button class="mebar" id="mine" type="button" aria-live="polite"></button>
  <section class="panel ward" id="now" aria-live="polite"></section>
  <section class="panel cal" id="calbox">
    <div class="calh"><button class="mbtn" id="prevM" type="button" aria-label="이전 달">‹</button><h2 id="calT"></h2><button class="mbtn" id="nextM" type="button" aria-label="다음 달">›</button></div>
    <div class="grid" id="cal"></div>
  </section>
  <section class="hero" id="hero"></section>
  <section class="panel" id="pics">
    <h2>원본 근무표</h2>
    <div class="tabs"><button class="tab" type="button" data-p="11" aria-pressed="true">11월</button><button class="tab" type="button" data-p="12" aria-pressed="false">12월</button></div>
    <div class="shot" id="shot"><img id="shotImg" src="img/nov.png" alt="2026년 11월 근무표 원본 사진"></div>
    <div class="note">사진을 누르면 원래 크기로 커져요. 옆으로 밀어서 볼 수 있어요.</div>
  </section>
</main>
<script>
{
const RAW={"11":[["송하연","A","N / / / D D E E / D D D D / // E N N / / E E E // / D N N / /"],["강은미","A","D / / N N / / E E E E / D D / / / / N N / / D E / / D E N N"],["오은지","A","/ / d1 D E E / N N N / / E E E / D1 E E E / / N N / / / D D DCC"],["남규리","A","/ N N / / N N / / N N N / / D D D D DCC / N N / / E E E / E E"],["홍서혜","A","// D D E / MD MD MD / MD MD MD / N N / / / / D D D / D D MD MD / / MD"],["박혜진","A","E E E / / D D D / T2 T2 E / // MD N / / D MD MD MD / T2 N N / / / D"],["정다율","B","// D D D E E // // E E N N // // N N / // D D D D / T2 E E E / N N"],["강혜원","B","D E / MD N N N / / D E E E / / D D D / D N N / / D D1 D1 / / T2"],["윤수경","B","/ d1 d1 d1 d1 d1 / / d1 d1 d1 d1 d1 / / d1 N N / / / E E E / D N N / /"],["김휘선","B","E E E E / / E N N N / / D D D / E E E / / / D D N N / / D D"],["김지우","B","N N / / D d D / d D D / N N / / / D1 MD E E / N N / / D D E /"],["황선하","B","MD / N N / / / / MD T2 T2 D / E E E / MD N N / / MD MD MD / D E / T2"],["윤가현","C","// E E E E / // // d D1 E / N N / / E E E E // // N N N / / D D E"],["정온유","C","/ D D D / E N N N / / E E E E / / D N N / / / D D N N / / D"],["박주은","C","E N N N / / D D E E N / / D D D D / D DCC / / D1 E E E / / E E"],["박윤정","C","/ MD MD / N N / / / T5 D D D / N N N / / D D D D / / / E E / N"],["김수현","C","N / / D1 D d / D d T5 / N N / / E E / MD MD N N / / / D1 D1 MD MD /"],["신은지","C","D / H2 H2 MD / E E / T2 T2 / MD MD / MD MD N / / E E E / / D D N N /"]],"12":[["송하연","A","E E / / N N / / D D H2 // N N / / D D E E E / / D D // / D E E E"],["강은미","A","/ / E E E / E E N N / / E E E / N N / / D D D E / / E E / N N"],["오은지","A","/ / N N / / / D D H2 D D / D D D D / // D N N / / / N N / / D D"],["남규리","A","N N / / D E / / E E E / D DCC N N / / D E / E E E / D D N N / /"],["홍서혜","A","MD / D D / D D / T2 MD N N / / MD MD MD E / MD MD / N N N / / / D MD /"],["박혜진","A","D D MD / MD MD MD N / / MD E / // / E E / N N / / MD MD E E / MD MD E /"],["정다율","B","/ / E E / E N N / / E E / / N N / / d 결혼 d d 결혼 결혼 // // 결혼 결혼 결혼 결혼 //"],["강혜원","B","N N / / / D DCC D D / N N / / / E E E E / / E E N N / / D D D /"],["윤수경","B","/ D D DCC N N N / / D D D E / D D N N / / E E // / D N N / / E E"],["김휘선","B","D D / D D / D DCC N N / / D D E / H2 H2 N N / / D DCC E E E / / N N"],["김지우","B","/ E N N / / E E E / / / MD E / / D1 D / D N N N / / D D E E / D"],["황선하","B","E / / MD E / MD MD MD E / / N N / / D MD MD / D MD MD E / / MD N N / /"],["윤가현","C","E / / d 결혼 결혼 결혼 결혼 결혼 결혼 결혼 // // // // // // d d // / N N / / D D N N / /"],["정온유","C","D N N / / D D D D / E N N / / D D E / N N / / D E E / / E E /"],["박주은","C","/ D D N N / / E E E / E E N N / / D E E / / D N N / / / D1 D1 D"],["박윤정","C","N / / / D E E / E N N / / E E E E / / D D D DCC D / // E E / N N"],["김수현","C","/ E E E E / / N N / / D D D D / MD N N / / / D1 D1 D N N / / D1 E"],["신은지","C","/ MD MD / / N N / / D D MD / MD MD N N / / / E E E / MD MD / D D D MD"]]};
const ME='정온유',MY='C';
const SN={D:'데이',E:'이브닝',N:'나이트',MD:'미드'};
const HRS={D:'07–15시',E:'15–23시',N:'23–07시',MD:''};
const WD=['일','월','화','수','목','금','토'];
const people=RAW['11'].map(r=>({n:r[0],t:r[1]}));
const days=[];
for(const m of ['11','12']){
  const rows=RAW[m].map(r=>[r[0],r[2].split(' ')]);
  const len=rows[0][1].length;
  for(let d=1;d<=len;d++){
    const c={};rows.forEach(([n,a])=>c[n]=a[d-1]);
    const dt=new Date(2026,+m-1,d);
    days.push({m:+m,d,w:dt.getDay(),c});
  }
}
const cat=x=>x==='D'||x==='d'||x==='D1'?'D':x==='E'?'E':x==='N'?'N':x==='MD'?'MD':x==='/'?'OFF':x==='//'?'WOFF':x==='결혼'?'LEAVE':'ETC';
const etcName=x=>/^T\d/.test(x)?'교육':x==='H2'?'성장':x==='결혼'?'결혼휴가':x;
const pillTxt=x=>{const k=cat(x);return k==='OFF'?'오프':k==='WOFF'?'원티드':k==='LEAVE'?'휴가':k==='ETC'?etcName(x):x==='MD'?'MD':k};
const team=n=>people.find(p=>p.n===n).t;
const on=(i,s)=>i<0||i>=days.length?null:people.filter(p=>cat(days[i].c[p.n])===s).map(p=>({...p,code:days[i].c[p.n]})).sort((a,b)=>(b.t===MY)-(a.t===MY));
const fmt=i=>{const x=days[i];return `${x.m}월 ${x.d}일 ${WD[x.w]}요일`};
const short=i=>{const x=days[i];return `${x.m}/${x.d} (${WD[x.w]})`};
const chip=(p,big)=>`<span class="chip${big?' big':''}${p.n===ME?' self':''}"><span class="t t-${p.t}">${p.t}</span>${p.n}${p.code&&p.code!=='D'&&p.code!=='E'&&p.code!=='N'&&p.code!=='MD'?`<span class="cd">${etcName(p.code)}</span>`:''}</span>`;
const kst=()=>{const n=new Date();return new Date(n.getTime()+(540+n.getTimezoneOffset())*60000)};
const idxOf=(m,d)=>days.findIndex(x=>x.m===m&&x.d===d);
let sel=0;
{const k=kst();let i=idxOf(k.getMonth()+1,k.getDate());if(k.getFullYear()!==2026||i<0)i=k<new Date(2026,10,1)?0:days.length-1;else if(k.getHours()<7&&i>0&&cat(days[i-1].c[ME])==='N')i-=1;sel=i}
const todayI=sel;
const $=id=>document.getElementById(id);

let viewM=0;
function cal(){
  const m=viewM||days[sel].m;
  $('calT').textContent=`2026년 ${m}월`;
  $('prevM').disabled=m===11;$('nextM').disabled=m===12;
  let h=WD.map((w,i)=>`<div class="wk${i===0?' sun':i===6?' sat':''}">${w}</div>`).join('');
  const list=days.map((x,i)=>({...x,i})).filter(x=>x.m===m);
  for(let k=0;k<list[0].w;k++)h+='<span class="day empty"></span>';
  for(const x of list){
    const code=x.c[ME],k=cat(code);
    h+=`<button type="button" class="day${x.i===todayI?' today':''}" data-i="${x.i}" aria-pressed="${x.i===sel}" aria-label="${fmt(x.i)} ${pillTxt(code)}"><span class="n${x.w===0?' sun':x.w===6?' sat':''}">${x.d}</span><span class="pill k-${k}">${pillTxt(code)}</span></button>`;
  }
  $('cal').innerHTML=h;
}
function pics(m){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p==String(m)));
  const img=$('shotImg');img.src=m===11?'img/nov.png':'img/dec.png';img.alt=`2026년 ${m}월 근무표 원본 사진`;
  $('shot').classList.remove('zoom');
}
function skyArt(k){
  const o='<svg viewBox="0 0 200 96" preserveAspectRatio="xMaxYMid meet" aria-hidden="true">';
  if(k==='D')return o+`<g class="bob"><circle cx="150" cy="44" r="34" fill="#fff4c9" opacity=".5"/><circle cx="150" cy="44" r="22" fill="#fff8e0"/></g><path d="M40 96 Q90 70 140 82 T200 74 V96Z" fill="#f08a1c" opacity=".4"/></svg>`;
  if(k==='E')return o+`<circle cx="148" cy="70" r="28" fill="#ffd08a" opacity=".9"/><defs><linearGradient id="wv" x1="0" x2="1"><stop offset="0" stop-color="#7a2450" stop-opacity="0"/><stop offset=".45" stop-color="#7a2450" stop-opacity=".5"/></linearGradient></defs><path d="M0 72 H200 V96 H0Z" fill="url(#wv)"/><path d="M110 80 H190 M126 88 H174" stroke="#ffd08a" stroke-width="2.5" stroke-linecap="round" opacity=".55"/></svg>`;
  if(k==='N'){let s='',r=11;for(let i=0;i<12;i++){r=r*16807%2147483647;const x=40+r%160;r=r*16807%2147483647;const y=6+r%84;s+=`<circle class="tw" style="animation-delay:${(i%5)*.6}s" cx="${x}" cy="${y}" r="${i%3?1.1:1.7}" fill="#fff"/>`}
    return o+`${s}<g class="bob"><circle cx="150" cy="46" r="24" fill="#f4f1ff"/><circle cx="161" cy="38" r="20" fill="#2b2f8f"/></g></svg>`}
  return o+`<g class="bob" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".3"><path d="M132 44 h16 l-16 20 h16"/><path d="M158 22 h12 l-12 15 h12"/></g><path d="M70 96 q40-22 80-4 q26 10 50 -2 V96Z" fill="currentColor" opacity=".08"/></svg>`;
}
/* 내 팀(C팀)은 맨 앞에 한 테두리로 묶고, 다른 팀은 뒤에 붙인다. lead는 묶음 맨 앞에 넣을 칩(나) */
const who=(list,big,lead='')=>{
  const m=list.filter(p=>p.t===MY),r=list.filter(p=>p.t!==MY);
  if(!lead&&!list.length)return '<div class="who"><span class="note">없음</span></div>';
  const g=lead||m.length?`<span class="mg">${lead}${m.map(p=>chip(p,big)).join('')}</span>`:'';
  return `<div class="who">${g}${r.map(p=>chip(p,big&&!g)).join('')}</div>`;
};
const nowTag=(i,s)=>i===nowI&&s===nowS?'<span class="nowtag">지금</span>':'';
function stopHtml(label,s,i,list){
  if(list===null)return `<div class="lab"><b>${label}</b> · ${SN[s]}</div><div class="note">${i<0?'10월':'1월'} 근무표가 없어요</div>`;
  let h=`<div class="lab"><b>${label}</b> · ${short(i)} ${SN[s]}${nowTag(i,s)}</div>`;
  if(!list.length)return h+`<div class="note">${SN[s]} 근무자가 없어요</div>`;
  h+=who(list,true);
  if(!list.some(p=>p.t===MY))h+=`<div class="note">이날 ${MY}팀 ${SN[s]} 근무자가 없어서 다른 팀에서 인계해요</div>`;
  return h;
}
/* 인계 카드 아래 칸: 그날 나머지 근무, 미드, 기타 */
function rowHtml(i,s,sub,hl){
  const l=on(i,s);
  return `<div class="row${hl?' on':''}" style="--c:var(--${s.toLowerCase()})"><div class="h"><b>${SN[s]}</b>${sub?`<span>${sub}</span>`:''}${nowTag(i,s)}</div>${who(l)}</div>`;
}
function etcRow(i){
  const etc=people.filter(p=>['ETC','LEAVE'].includes(cat(days[i].c[p.n]))).map(p=>({...p,code:days[i].c[p.n]}));
  return etc.length?`<div class="row"><div class="h"><b>기타</b><span>인계 제외</span></div>${who(etc)}</div>`:'';
}
function hero(){
  const code=days[sel].c[ME],k=cat(code);
  const isWork=k==='D'||k==='E'||k==='N';
  const title=isWork?SN[k]:k==='WOFF'?'원티드 오프':k==='OFF'?'오프':k==='LEAVE'?'휴가':etcName(code);
  const sub=isWork?`${HRS[k]} · C팀`+(code!==k?` · ${code}`:''):'쉬는 날이에요';
  let h=`<div class="sky ${k}">${skyArt(k)}<div class="dt">${fmt(sel)}${sel===todayI?' · 오늘':''}</div><h1>${title}</h1><div class="sub">${sub}</div></div>`;
  if(isWork){
    const from=k==='D'?[sel-1,'N']:k==='E'?[sel,'D']:[sel,'E'];
    const to=k==='D'?[sel,'E']:k==='E'?[sel,'N']:[sel+1,'D'];
    const fl=on(from[0],from[1]),tl=on(to[0],to[1]);
    const cv=s=>`var(--${s.toLowerCase()})`;
    const mates=on(sel,k).filter(p=>p.n!==ME);
    h+=`<div class="relay fade">
      <div class="stop" style="--c:${cv(from[1])};--c2:${cv(k)}"><div class="rail"><span class="line"></span><span class="baton"></span><span class="dot"></span></div><div class="body">${stopHtml('인계 받음',from[1],from[0],fl)}</div></div>
      <div class="stop mine" style="--c:${cv(k)};--c2:${cv(to[1])}"><div class="rail"><span class="line"></span><span class="baton" style="animation-delay:1.2s"></span><span class="dot"></span></div><div class="body"><div class="lab"><b>나</b>${mates.length?` · 같이 ${mates.length}명`:''}${nowTag(sel,k)}</div>${who(mates,true,chip({n:ME,t:MY,code},true))}</div></div>
      <div class="stop" style="--c:${cv(to[1])}"><div class="rail"><span class="dot"></span></div><div class="body" style="padding-bottom:0">${stopHtml('인계 줌',to[1],to[0],tl)}</div></div>
    </div>
    <div class="ext">${k==='D'?rowHtml(sel,'N',HRS.N):k==='N'?rowHtml(sel,'D',HRS.D):''}${rowHtml(sel,'MD','인계 없음')}${etcRow(sel)}</div>`;
  }else{
    let j=sel+1;while(j<days.length&&!['D','E','N'].includes(cat(days[j].c[ME])))j++;
    h+=`<div class="relay fade">`+
      (j<days.length?`<button class="next" style="margin-top:0" type="button" data-go="${j}"><span><span class="lab">다음 근무</span><br><b>${short(j)} ${SN[cat(days[j].c[ME])]}</b></span><span class="pill k-${cat(days[j].c[ME])}">${cat(days[j].c[ME])}</span></button>`:`<div class="note">12월 안에는 남은 근무가 없어요</div>`)+`</div>`+
      `<div class="ext">${['D','E','N','MD'].map(s=>rowHtml(sel,s,HRS[s])).join('')}${etcRow(sel)}</div>`;
  }
  $('hero').innerHTML=h;
  syncNow();
}
/* 인계 카드에 지금 근무가 이미 보이면 '지금 병동' 칸은 숨긴다 */
function syncNow(){$('now').hidden=nowI<0||!!$('hero').querySelector('.nowtag')}
const START={D:7,E:15,N:23},END={D:15,E:23,N:7};
let nowI=-1,nowS='';
function nowBox(){
  const k=kst(),h=k.getHours();
  let i=idxOf(k.getMonth()+1,k.getDate()),s=h>=7&&h<15?'D':h>=15&&h<23?'E':'N';
  const ti=i;
  if(h<7)i-=1;
  const box=$('now'),me=$('mine');
  if(k.getFullYear()!==2026||ti<0){box.hidden=true;me.hidden=true;nowI=-1;return}
  nowI=i;nowS=s;
  /* 병동: 지금 근무자 */
  if(i>=0){
    box.hidden=false;
    const l=on(i,s);
    box.innerHTML=`<div class="wh"><h2>지금 병동</h2><span class="pill k-${s}">${s}</span><b>${SN[s]}</b><span class="tm">${HRS[s]}</span></div>${who(l)}`;
  }else box.hidden=true;
  /* 나 */
  me.hidden=false;
  const W=['D','E','N'];
  const st=(j,c)=>{const x=days[j];return new Date(2026,x.m-1,x.d,START[c],0,0)};
  const dur=ms=>{let m=Math.max(0,Math.ceil(ms/60000));const d=Math.floor(m/1440);m-=d*1440;const hh=Math.floor(m/60),mm=m%60;return d?`${d}일 ${hh}시간 ${mm}분`:hh?`${hh}시간 ${mm}분`:`${mm}분`};
  let cur=-1,curS='',nxt=-1;
  for(let j=Math.max(0,ti-1);j<days.length;j++){const c=cat(days[j].c[ME]);if(!W.includes(c))continue;const a=st(j,c),b=new Date(a.getTime()+8*3600000);
    if(a<=k&&k<b){cur=j;curS=c;continue}
    if(a>k&&nxt<0){nxt=j;break}}
  const myNow=cur>=0;
  const cd=$('goNow');cd.hidden=false;
  let lab,txt,cc;
  if(myNow){const b=new Date(st(cur,curS).getTime()+8*3600000);lab='퇴근까지';txt=dur(b-k);cc=curS}
  else if(nxt>=0){const ns=cat(days[nxt].c[ME]),a=st(nxt,ns),dep=new Date(a.getTime()-3600000);cc=ns;
    if(k<dep){lab=`${SN[ns]} 출발까지`;txt=dur(dep-k)}else{lab=`${SN[ns]} 시작까지`;txt=dur(a-k)}}
  else{lab='남은 근무';txt='없음';cc=''}
  $('cdL').textContent=lab;$('cdT').textContent=txt;cd.style.setProperty('--c',cc?`var(--${cc.toLowerCase()})`:'var(--off)');
  cd.dataset.go=myNow?cur:nxt>=0?nxt:ti;
  /* 오늘 상태, 다음 근무, 남은 오프·이달 남은 근무 */
  const tc=days[ti].c[ME],tk=cat(tc);
  let html,go;
  if(myNow){html=`<span class="st"><span>나 · 지금</span><b>${SN[curS]} 근무 중 · ${END[curS]}시까지</b></span>`;go=cur}
  else{
    const today=W.includes(tk)?`오늘 ${SN[tk]}`:tk==='WOFF'?'오늘 원티드 오프':tk==='OFF'?'오늘 오프':`오늘 ${pillTxt(tc)}`;
    const nx=nxt<0?'12월 안에 남은 근무 없음':nxt===ti?`${HRS[tk]} 근무 예정`:`다음 근무 ${short(nxt)} <span class="pill ip k-${cat(days[nxt].c[ME])}">${cat(days[nxt].c[ME])}</span>`;
    html=`<span class="st"><span>나 · ${today}${W.includes(tk)&&nxt!==ti?' (끝남)':''}</span><b>${nx}</b></span>`;go=nxt<0?ti:nxt;
  }
  me.dataset.go=go;
  const tg=$('tog');tg.style.setProperty('--c',myNow?`var(--${curS.toLowerCase()})`:'var(--off)');
  if(myNow)setTimeout(()=>tg.classList.add('on'),250);else tg.classList.remove('on');
  const mk=myNow?curS:tk;
  me.innerHTML=`<span class="pill k-${mk}">${myNow?curS:pillTxt(tc)}</span>${html}<span class="go">보기 ›</span>`;
}
let shownM=0,swiped=-1e9;
function render(){
  if(days[sel].m!==viewM||!$('cal').children.length){viewM=days[sel].m;cal()}
  else $('cal').querySelectorAll('.day[data-i]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===sel));
  hero();
  if(shownM!==viewM){shownM=viewM;pics(viewM)}
}
nowBox();render();
setInterval(()=>{const was=nowI+nowS;nowBox();if(nowI+nowS!==was)hero();else syncNow()},30000);
$('cal').addEventListener('click',e=>{if(performance.now()-swiped<400)return;const b=e.target.closest('.day:not(.empty)');if(b){sel=+b.dataset.i;render()}});
$('hero').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){sel=+b.dataset.go;render()}});
const MONTHS=[...new Set(days.map(x=>x.m))];
function goMonth(dir){const i=MONTHS.indexOf(viewM)+dir;if(i<0||i>=MONTHS.length)return false;viewM=MONTHS[i];cal();shownM=viewM;pics(viewM);return true}
$('prevM').addEventListener('click',()=>goMonth(-1));
$('nextM').addEventListener('click',()=>goMonth(1));
/* 달력 좌우 스와이프로 달 넘기기 */
let sx=0,sy=0;
const calEl=$('calbox');
calEl.addEventListener('touchstart',e=>{const p=e.touches[0];sx=p.clientX;sy=p.clientY},{passive:true});
calEl.addEventListener('touchend',e=>{const p=e.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=performance.now();goMonth(dx<0?1:-1)}},{passive:true});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>pics(+b.dataset.p)));
$('shotImg').addEventListener('click',()=>$('shot').classList.toggle('zoom'));
$('mine').addEventListener('click',()=>{const g=+$('mine').dataset.go;if(g>=0){sel=g;render()}});
$('goNow').addEventListener('click',()=>{const g=+$('goNow').dataset.go;if(g>=0){sel=g;render()}});
}
</script>
</body>
</html>
